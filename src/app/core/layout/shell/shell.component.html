<div class="shell" [class.sidebar-collapsed]="!sidebarOpen">
  <app-navbar (menuToggle)="toggleSidebar()" />
  <div class="shell__body">
    <app-sidebar [isOpen]="sidebarOpen" />
    @if (isMobile && sidebarOpen) {
      <div class="shell__backdrop" (click)="closeSidebar()"></div>
    }
    <main class="shell__content" [@routeFade]="getRouteState(outlet)">
      <router-outlet #outlet="outlet" />
    </main>
  </div>
</div>
