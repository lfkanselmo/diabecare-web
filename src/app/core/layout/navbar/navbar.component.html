<mat-toolbar class="navbar">
  <button mat-icon-button (click)="onMenuToggle()" [attr.aria-label]="'navbar.openMenu' | transloco">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="navbar__brand">
    <span class="navbar__logo-wrap">
      <mat-icon class="navbar__logo">monitor_heart</mat-icon>
    </span>
    DiabeCare
  </span>

  <span class="navbar__spacer"></span>

  @if (latestReading(); as reading) {
  <a class="navbar__glucose-chip" routerLink="/app/glucose"
    [style.background]="getChipBg(reading.status)"
    [style.border-color]="getChipColor(reading.status)"
    [matTooltip]="getStatusLabel(reading.status)">
    <mat-icon class="navbar__chip-icon" [style.color]="getChipColor(reading.status)">
      water_drop
    </mat-icon>
    <span class="navbar__chip-value" [style.color]="getChipColor(reading.status)">
      {{ reading.value }}
      <span class="navbar__chip-unit">mg/dL</span>
    </span>
  </a>
  }

  @if (showNotifButton()) {
  <button mat-icon-button
    [matTooltip]="(notificationsEnabled() ? 'navbar.disableNotifications' : 'navbar.enableNotifications') | transloco"
    [attr.aria-label]="(notificationsEnabled() ? 'navbar.disableNotifications' : 'navbar.enableNotifications') | transloco"
    (click)="onToggleNotifications()">
    <mat-icon>{{ notificationsEnabled() ? 'notifications_active' : 'notifications_none' }}</mat-icon>
  </button>
  }

  <button mat-icon-button [matTooltip]="(themeService.isDark() ? 'navbar.lightMode' : 'navbar.darkMode') | transloco"
    [attr.aria-label]="(themeService.isDark() ? 'navbar.lightMode' : 'navbar.darkMode') | transloco"
    (click)="themeService.toggleTheme()">
    <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="languageMenu" [matTooltip]="'navbar.language' | transloco"
    [attr.aria-label]="'navbar.language' | transloco">
    <mat-icon>language</mat-icon>
  </button>

  <mat-menu #languageMenu="matMenu">
    @for (lang of languages; track lang.value) {
    <button mat-menu-item (click)="onSelectLanguage(lang.value)"
      [class.navbar__lang-active]="languageService.currentLang() === lang.value">
      <span>{{ lang.label }}</span>
    </button>
    }
  </mat-menu>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" [attr.aria-label]="'navbar.userMenu' | transloco">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item routerLink="/app/profile">
      <mat-icon>person</mat-icon>
      <span>{{ 'navbar.myProfile' | transloco }}</span>
    </button>
    @if (isAdmin) {
    <button mat-menu-item routerLink="/app/admin">
      <mat-icon>admin_panel_settings</mat-icon>
      <span>{{ 'navbar.admin' | transloco }}</span>
    </button>
    }
    <mat-divider />
    <button mat-menu-item (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>{{ 'navbar.logout' | transloco }}</span>
    </button>
  </mat-menu>
</mat-toolbar>
